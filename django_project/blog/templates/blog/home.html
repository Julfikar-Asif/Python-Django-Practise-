{% extends "blog/base.html" %}   {# layout base theke nibe  #}
{% block content %}
    {% for post in posts%}
        <h1>{{ post.title }}</h1>  <!--double curly braces are used to display the value of the variable. -->
        <p>By {{ post.author }} on {{ post.date_posted }} </p>
        <p>{{ post.content }}</p>
    {% endfor %}
{% endblock content %}
